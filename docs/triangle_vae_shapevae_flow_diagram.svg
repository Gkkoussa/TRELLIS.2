<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Triangle VAE, ShapeVAE, and Shape-Conditioned Triangle Latent Flow</title>
  <desc id="desc">A presentation diagram showing how triangle field features are encoded into triangle latents, how shape features are encoded into shape latents, and how a latent flow model uses noise plus shape latents to generate triangle latents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e9"/>
      <stop offset="55%" stop-color="#edf4f0"/>
      <stop offset="100%" stop-color="#e8eef8"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9c06a"/>
      <stop offset="100%" stop-color="#ef6f57"/>
    </linearGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76c7b7"/>
      <stop offset="100%" stop-color="#2d8c9c"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9db4ff"/>
      <stop offset="100%" stop-color="#6b73d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1f2933" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#28313b"/>
    </marker>
    <marker id="arrowSoft" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font: 800 44px Georgia, "Times New Roman", serif; fill: #1e2935; letter-spacing: -0.8px; }
      .subtitle { font: 500 20px Georgia, "Times New Roman", serif; fill: #53606c; }
      .lane-title { font: 800 28px Georgia, "Times New Roman", serif; fill: #1f2933; }
      .lane-note { font: 500 17px Georgia, "Times New Roman", serif; fill: #596672; }
      .box-title { font: 800 24px Georgia, "Times New Roman", serif; fill: #1f2933; }
      .box-small { font: 500 18px Georgia, "Times New Roman", serif; fill: #34404a; }
      .box-tiny { font: 500 15px Georgia, "Times New Roman", serif; fill: #53606c; }
      .label { font: 700 17px Georgia, "Times New Roman", serif; fill: #34404a; }
      .pill { font: 700 15px Georgia, "Times New Roman", serif; fill: #28313b; }
      .mono { font: 700 18px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #28313b; }
      .arrow { stroke: #28313b; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .arrow-soft { stroke: #6b7280; stroke-width: 3.5; fill: none; marker-end: url(#arrowSoft); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 10; }
      .panel { fill: rgba(255, 255, 255, 0.66); stroke: rgba(42, 49, 59, 0.12); stroke-width: 2; }
      .box { fill: #fffaf2; stroke: rgba(42, 49, 59, 0.16); stroke-width: 2; filter: url(#shadow); }
      .box-blue { fill: #f5f7ff; stroke: rgba(42, 49, 59, 0.16); stroke-width: 2; filter: url(#shadow); }
      .box-green { fill: #f1fbf8; stroke: rgba(42, 49, 59, 0.16); stroke-width: 2; filter: url(#shadow); }
      .box-gray { fill: #f7f7f4; stroke: rgba(42, 49, 59, 0.16); stroke-width: 2; filter: url(#shadow); }
      .chip { fill: #ffffff; stroke: rgba(42, 49, 59, 0.14); stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <circle cx="1560" cy="165" r="220" fill="#ffffff" opacity="0.26"/>
  <circle cx="210" cy="950" r="280" fill="#ffffff" opacity="0.22"/>
  <path d="M0,210 C280,100 430,260 700,150 C980,40 1140,190 1390,100 C1570,35 1685,65 1800,20 L1800,0 L0,0 Z" fill="#ffffff" opacity="0.26"/>

  <text x="90" y="84" class="title">Triangle Field VAE + ShapeVAE + Latent Flow</text>
  <text x="92" y="123" class="subtitle">Previous generation stack: rich triangle-field encoding, shape latent conditioning, and flow over triangle latents.</text>

  <!-- Lane backgrounds -->
  <rect x="70" y="170" width="1660" height="250" rx="34" class="panel"/>
  <rect x="70" y="455" width="1660" height="245" rx="34" class="panel"/>
  <rect x="70" y="735" width="1660" height="290" rx="34" class="panel"/>

  <!-- Triangle VAE lane -->
  <rect x="95" y="194" width="16" height="202" rx="8" fill="url(#tri)"/>
  <text x="132" y="226" class="lane-title">Triangle Field VAE</text>
  <text x="132" y="255" class="lane-note">Auxiliary geometry enriches the latent space; only the two distance fields are reconstructed.</text>

  <rect x="160" y="292" width="315" height="92" rx="22" class="box"/>
  <text x="186" y="326" class="box-title">20-channel voxel input</text>
  <text x="186" y="354" class="box-small">fields: <tspan class="mono">d_tri</tspan>, <tspan class="mono">d_vert</tspan></text>
  <text x="186" y="378" class="box-tiny">aux: normals, offsets, vertex displacements</text>

  <path d="M486,338 L610,338" class="arrow"/>
  <rect x="620" y="279" width="240" height="118" rx="24" class="box"/>
  <text x="678" y="318" class="box-title">Encoder</text>
  <text x="658" y="350" class="box-small">sparse U-Net VAE</text>
  <text x="679" y="374" class="box-tiny">posterior over latents</text>

  <path d="M872,338 L995,338" class="arrow"/>
  <rect x="1005" y="290" width="235" height="96" rx="24" class="box"/>
  <text x="1059" y="328" class="box-title">Triangle latent</text>
  <text x="1085" y="358" class="mono">z_tri</text>

  <path d="M1252,338 L1370,338" class="arrow"/>
  <rect x="1380" y="279" width="250" height="118" rx="24" class="box"/>
  <text x="1452" y="318" class="box-title">Decoder</text>
  <text x="1424" y="350" class="box-small">uses GT subdiv /</text>
  <text x="1421" y="374" class="box-small">known sparse support</text>

  <path d="M1505,407 C1505,438 1505,455 1505,477" class="arrow-soft"/>
  <rect x="1325" y="175" width="305" height="58" rx="18" class="chip"/>
  <text x="1351" y="211" class="pill">GT subdivision info enters decoder</text>
  <path d="M1478,233 C1485,250 1494,261 1505,279" class="arrow-soft"/>

  <rect x="1300" y="485" width="330" height="86" rx="24" class="box"/>
  <text x="1340" y="520" class="box-title">Reconstructed target</text>
  <text x="1396" y="550" class="mono">[d_tri, d_vert]</text>

  <!-- ShapeVAE lane -->
  <rect x="95" y="479" width="16" height="197" rx="8" fill="url(#shape)"/>
  <text x="132" y="511" class="lane-title">ShapeVAE</text>
  <text x="132" y="540" class="lane-note">Encodes the coarse shape; the decoder predicts subdivision/support from the shape latent.</text>

  <rect x="165" y="585" width="290" height="78" rx="22" class="box-green"/>
  <text x="206" y="619" class="box-title">Shape / o-voxel input</text>
  <text x="217" y="646" class="box-small">sparse occupancy geometry</text>

  <path d="M466,624 L595,624" class="arrow"/>
  <rect x="605" y="566" width="235" height="116" rx="24" class="box-green"/>
  <text x="660" y="605" class="box-title">Shape encoder</text>
  <text x="678" y="637" class="box-small">shape latent</text>
  <text x="700" y="663" class="mono">z_shape</text>

  <path d="M852,624 L987,624" class="arrow"/>
  <rect x="997" y="566" width="310" height="116" rx="24" class="box-green"/>
  <text x="1071" y="605" class="box-title">Shape decoder</text>
  <text x="1038" y="637" class="box-small">predicts subdivisions</text>
  <text x="1060" y="663" class="box-tiny">learned sparse upsampling</text>

  <path d="M1318,624 L1465,624" class="arrow"/>
  <rect x="1475" y="585" width="170" height="78" rx="22" class="box-green"/>
  <text x="1511" y="619" class="box-title">Shape</text>
  <text x="1518" y="646" class="box-small">support</text>

  <!-- Flow lane -->
  <rect x="95" y="759" width="16" height="242" rx="8" fill="url(#flow)"/>
  <text x="132" y="791" class="lane-title">Shape-Conditioned Triangle Latent Flow</text>
  <text x="132" y="820" class="lane-note">Flow starts from noise on triangle-latent support and denoises/generates triangle latents conditioned on ShapeVAE.</text>

  <rect x="150" y="866" width="255" height="92" rx="22" class="box-blue"/>
  <text x="191" y="901" class="box-title">Gaussian noise</text>
  <text x="198" y="931" class="box-small">on triangle latent support</text>

  <path d="M417,912 L545,912" class="arrow"/>
  <rect x="555" y="843" width="365" height="138" rx="26" class="box-blue"/>
  <text x="621" y="882" class="box-title">Latent flow model</text>
  <text x="599" y="914" class="box-small">input: noisy latent + time</text>
  <text x="589" y="942" class="box-small">conditioning: <tspan class="mono">z_shape</tspan></text>
  <text x="629" y="966" class="box-tiny">predicts clean triangle latent</text>

  <path d="M932,912 L1062,912" class="arrow"/>
  <rect x="1072" y="864" width="245" height="96" rx="24" class="box-blue"/>
  <text x="1124" y="902" class="box-title">Generated</text>
  <text x="1110" y="932" class="mono">z_tri</text>

  <path d="M1329,912 L1454,912" class="arrow"/>
  <rect x="1464" y="843" width="240" height="138" rx="26" class="box-blue"/>
  <text x="1531" y="882" class="box-title">Triangle</text>
  <text x="1531" y="911" class="box-title">decoder</text>
  <text x="1508" y="943" class="box-small">fields: <tspan class="mono">d_tri</tspan>, <tspan class="mono">d_vert</tspan></text>
  <text x="1509" y="968" class="box-tiny">render / train downstream</text>

  <!-- Cross-lane conditioning arrows -->
  <path d="M722,682 C722,733 722,777 722,843" class="arrow-soft"/>
  <text x="748" y="760" class="label">shape conditioning</text>

  <path d="M1124,386 C1124,540 1124,710 1194,864" class="arrow-soft"/>
  <text x="1138" y="724" class="label">triangle latent target distribution</text>

  <path d="M1560,663 C1560,732 1560,780 1560,843" class="arrow-soft"/>
  <text x="1345" y="763" class="label">predicted shape support can guide generation</text>

  <!-- Legend -->
  <rect x="90" y="1042" width="1620" height="54" rx="18" fill="#ffffff" opacity="0.72" stroke="rgba(42,49,59,0.12)" stroke-width="2"/>
  <line x1="125" y1="1069" x2="185" y2="1069" class="arrow"/>
  <text x="202" y="1075" class="box-small">main data path</text>
  <line x1="390" y1="1069" x2="450" y2="1069" class="arrow-soft"/>
  <text x="467" y="1075" class="box-small">conditioning or support information</text>
  <text x="775" y="1075" class="box-small">Key distinction: Triangle VAE encoder uses aux features, but the target remains only <tspan class="mono">d_tri</tspan> and <tspan class="mono">d_vert</tspan>.</text>
</svg>
